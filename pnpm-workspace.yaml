packages:
  - artifacts/*
  - lib/*

autoInstallPeers: false

catalog:
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ~19.1.17
  '@types/react-dom': ~19.1.11
  drizzle-orm: ^0.45.2
  # Must match Expo SDK 54.
  react: 19.1.0
  react-dom: 19.1.0
  tsx: 4.21.0
  zod: ^3.25.76

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

patchedDependencies:
  metro@0.83.3: patches/metro@0.83.3.patch

# Keep security fixes from the prototype, but do not strip binaries for other
# operating systems: developers also need to install this on macOS/Windows.
overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok>uuid': 11.1.1
  body-parser@2: 2.4.0
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  esbuild: 0.28.2
  fast-uri@3: 3.1.9
  image-size@1: 2.1.0
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  metro-babel-transformer@0.83: 0.83.3
  metro-cache-key@0.83: 0.83.3
  metro-cache@0.83: 0.83.3
  metro-config@0.83: 0.83.3
  metro-core@0.83: 0.83.3
  metro-file-map@0.83: 0.83.3
  metro-minify-terser@0.83: 0.83.3
  metro-resolver@0.83: 0.83.3
  metro-runtime@0.83: 0.83.3
  metro-source-map@0.83: 0.83.3
  metro-symbolicate@0.83: 0.83.3
  metro-transform-plugins@0.83: 0.83.3
  metro-transform-worker@0.83: 0.83.3
  metro@0.83: 0.83.3
  nanoid@3: 3.3.18
  postcss@8: 8.5.23
  qs@6: 6.17.1
